<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行きたい食事処マップ</title>

  <!-- Leaflet 1.9.4 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── タブ ── */
    #tab-bar {
      flex: none;
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }
    #tab-bar button {
      flex: 1;
      padding: 11px 0;
      font: inherit;
      font-size: 14px;
      color: #6b7280;
      background: #fff;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    #tab-bar button[aria-selected="true"] {
      color: #2563eb;
      font-weight: 600;
      border-bottom-color: #2563eb;
    }
    #tab-bar button#tab-settings {
      flex: none;
      width: 44px;
      font-size: 17px;
    }

    /* ── 設定パネル ── */
    #settings {
      display: none;
      flex: none;
      padding: 10px 12px 12px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
      color: #374151;
      line-height: 1.7;
    }
    #settings p { margin-bottom: 6px; }
    #settings input {
      width: 100%;
      padding: 6px 8px;
      font: inherit;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
    }
    #settings .row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    #settings button {
      padding: 6px 14px;
      font: inherit;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
      cursor: pointer;
    }
    #settings button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    /* ── 保存結果の通知 ── */
    #toast {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 2000;
      max-width: 92vw;
      padding: 9px 16px;
      border-radius: 6px;
      background: rgba(31, 41, 55, 0.94);
      color: #fff;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    #toast.error { background: rgba(185, 28, 28, 0.96); }

    /* ── タグ絞り込み ── */
    #tag-bar {
      flex: none;
      display: flex;
      gap: 6px;
      padding: 8px;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid #e5e7eb;
    }
    #tag-bar button {
      flex: none;
      padding: 5px 13px;
      font: inherit;
      font-size: 13px;
      color: #374151;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      cursor: pointer;
    }
    #tag-bar button[aria-pressed="true"] {
      color: #fff;
      background: #2563eb;
      border-color: #2563eb;
    }
    #tag-bar button[disabled] {
      opacity: .35;
      cursor: default;
    }

    /* ── 地図ビュー ── */
    #map-view {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* ── リストビュー ── */
    #list-view {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: #f9fafb;
    }
    .empty {
      padding: 24px 0;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    /* ── 店リスト 表 ── */
    #restaurant-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    #restaurant-table thead th {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 2px solid #e5e7eb;
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      color: #374151;
      font-weight: 600;
      z-index: 10;
    }
    #restaurant-table tbody tr.data-row {
      cursor: pointer;
      border-bottom: 1px solid #e5e7eb;
    }
    #restaurant-table tbody tr.data-row:hover {
      background: #f3f4f6;
    }
    #restaurant-table tbody tr.data-row.open {
      background: #eff6ff;
    }
    #restaurant-table tbody td {
      padding: 8px 10px;
      vertical-align: middle;
      color: #374151;
    }
    #restaurant-table tbody td.col-name {
      font-weight: 600;
      white-space: nowrap;
    }
    #restaurant-table tbody td.col-tags {
      min-width: 80px;
    }
    #restaurant-table tbody td.col-area,
    #restaurant-table tbody td.col-recommended,
    #restaurant-table tbody td.col-rating,
    #restaurant-table tbody td.col-visits {
      white-space: nowrap;
    }
    /* 詳細行 */
    #restaurant-table tbody tr.detail-row td {
      padding: 0;
      background: #eff6ff;
      border-bottom: 2px solid #bfdbfe;
    }
    /* 表は列が多くて横スクロールする。住所やメモまで一緒に流れると読めないので、
       詳細だけは左端に貼り付けて画面幅に収める。 */
    #restaurant-table tbody tr.detail-row .detail-content {
      position: sticky;
      left: 0;
      width: 100vw;
      max-width: 100vw;
      box-sizing: border-box;
      padding: 10px 14px 14px;
    }
    /* タグチップ */
    .tag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag-chip {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      background: #e5e7eb;
      color: #374151;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ── 凡例 ── */
    #legend {
      position: absolute;
      bottom: 28px;
      right: 8px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1.8;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #legend .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .dot-unvisited { background: #2563eb; }
    .dot-visited   { background: #16a34a; }

    /* ── 座標未取得リスト ── */
    #no-coords {
      display: none;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      color: #6b7280;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
      max-width: 90vw;
      text-align: center;
    }

    /* ── 店の詳細（ポップアップとリスト詳細で共用） ── */
    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.6;
      min-width: 200px;
      max-width: 80vw;
    }
    .leaflet-popup-content h3 {
      font-size: 15px;
      margin-bottom: 4px;
    }
    .leaflet-popup-content p {
      margin: 2px 0;
      color: #374151;
      font-size: 14px;
      line-height: 1.6;
    }
    .detail-content h3 {
      font-size: 15px;
      margin-bottom: 4px;
    }
    .detail-content p {
      margin: 2px 0;
      color: #374151;
      font-size: 14px;
      line-height: 1.6;
    }
    .muted { color: #6b7280; }
    .addr  { color: #6b7280; font-size: 13px; }

    .links {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .links a {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
    }
    .links a.gmaps {
      background: #16a34a;
    }

    /* ── 来店回数と評価の編集 ── */
    .edit {
      margin-top: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .edit button {
      padding: 3px 10px;
      font: inherit;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
      color: #374151;
      cursor: pointer;
    }
    .edit button.visit {
      border-color: #16a34a;
      color: #16a34a;
      font-weight: 600;
    }
    .edit button[disabled] { opacity: .4; cursor: default; }

    /* 星は下地のグレーに黄色を width で被せて 0.5 刻みを表現する */
    .stars {
      position: relative;
      display: inline-block;
      font-size: 19px;
      line-height: 1;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .stars .base { color: #d1d5db; }
    .stars .fill {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      white-space: nowrap;
      color: #f59e0b;
      pointer-events: none;
    }
    .stars .hit {
      position: absolute;
      top: 0;
      height: 100%;
      width: 10%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="tab-bar">
  <button id="tab-map"  aria-selected="true">地図</button>
  <button id="tab-list" aria-selected="false">リスト</button>
  <button id="tab-settings" title="設定" aria-label="設定">⚙</button>
</div>

<div id="settings">
  <p id="token-state"></p>
  <p class="muted">
    来店回数と評価をこの画面から書き換えるには GitHub のアクセストークンが要ります。
    <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token</a>
    を <b>restaurant_list リポジトリのみ</b>・<b>Contents: Read and write</b> で作ってください。
    トークンはこの端末のブラウザにだけ保存されます。
  </p>
  <input id="token-input" type="password" autocomplete="off" placeholder="github_pat_..." />
  <div class="row">
    <button id="token-save" class="primary">保存</button>
    <button id="token-clear">削除</button>
  </div>
</div>

<div id="tag-bar"></div>

<div id="map-view">
  <div id="map"></div>
  <div id="legend">
    <span class="dot dot-unvisited"></span>未訪問<br>
    <span class="dot dot-visited"></span>訪問済
  </div>
  <div id="no-coords"></div>
</div>

<div id="list-view"></div>

<div id="toast"></div>

<script>
(async () => {
  const el = id => document.getElementById(id);

  const REPO = 'h-takaha/restaurant_list';
  const MD_PATH = 'restaurants.md';
  // 同じ origin に別のページも載っているので、キーは用途込みで持つ
  const TOKEN_KEY = 'restaurant_list.github_token';

  // ── データ読み込み ──────────────────────────────────────────
  let restaurants;
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    restaurants = await res.json();
  } catch (e) {
    el('no-coords').style.display = 'block';
    el('no-coords').textContent = 'data.json の読み込みに失敗しました: ' + e.message;
    return;
  }

  // ── 地図（初期ビューは fitBounds で上書きされる） ──
  const map = L.map('map').setView([43.8, 143.9], 13);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  const markerGroup = L.layerGroup().addTo(map);

  // ── マーカーアイコン（色分け） ──
  function makeIcon(visited) {
    const color = visited ? '#16a34a' : '#2563eb';
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36">
        <path d="M12 0C5.373 0 0 5.373 0 12c0 9 12 24 12 24S24 21 24 12C24 5.373 18.627 0 12 0z"
              fill="${color}" stroke="#fff" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="5" fill="#fff"/>
      </svg>`;
    return L.divIcon({
      html: svg,
      className: '',
      iconSize: [24, 36],
      iconAnchor: [12, 36],
      popupAnchor: [0, -36],
    });
  }

  // ── 星（0.5 刻み） ──
  function starsHtml(i, rating, editable) {
    const pct = ((rating ?? 0) / 5) * 100;
    let hits = '';
    if (editable) {
      for (let step = 1; step <= 10; step++) {
        hits += `<button class="hit" data-act="rate" data-i="${i}" data-value="${step / 2}"`
          + ` style="left:${(step - 1) * 10}%" aria-label="★${step / 2}"></button>`;
      }
    }
    return `<span class="stars">`
      + `<span class="base">★★★★★</span>`
      + `<span class="fill" style="width:${pct}%">★★★★★</span>`
      + hits
      + `</span>`;
  }

  // ── タグチップの HTML ──
  function tagChipsHtml(tags) {
    if (!tags || tags.length === 0) return '';
    return `<div class="tag-chips">${tags.map(t => `<span class="tag-chip">${escHtml(t)}</span>`).join('')}</div>`;
  }

  // ── 店の詳細（ポップアップとリスト詳細で共用） ──
  function detailHtml(r) {
    const i = restaurants.indexOf(r);
    const editable = hasToken();
    const hpHtml = r.hpUrl
      ? `<a href="${escHtml(r.hpUrl)}" target="_blank" rel="noopener">${escHtml(r.hpLabel || '公式サイト')}</a>`
      : '';
    const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}`;
    const visitLabel = r.visits > 0 ? `来店 ${r.visits} 回` : '未訪問';
    const ratingLabel = r.rating == null ? '未評価' : r.rating.toFixed(1);
    const tagsLine = (r.tags && r.tags.length > 0)
      ? r.tags.map(t => escHtml(t)).join('・')
      : '';
    return `
      <h3>${escHtml(r.name)}</h3>
      <p>${tagsLine}　<span class="muted">${visitLabel}</span></p>
      ${r.recommended ? `<p>🍽 ${escHtml(r.recommended)}</p>` : ''}
      <p class="addr">${escHtml(r.address)}</p>
      <div class="edit">
        ${starsHtml(i, r.rating, editable)}
        <span class="muted">${ratingLabel}</span>
        ${editable && r.rating != null ? `<button data-act="rate-clear" data-i="${i}">評価を消す</button>` : ''}
      </div>
      ${editable ? `
      <div class="edit">
        <button class="visit" data-act="visit-inc" data-i="${i}">来店 +1</button>
        <button data-act="visit-dec" data-i="${i}"${r.visits === 0 ? ' disabled' : ''}>−1</button>
      </div>` : ''}
      <div class="links">
        ${hpHtml}
        <a href="${gmapsUrl}" target="_blank" rel="noopener" class="gmaps">Google マップ</a>
      </div>`;
  }

  // ── 詳細行の中身（表用。住所・HP・Gmaps・メモ・編集UI） ──
  function rowDetailHtml(r) {
    const i = restaurants.indexOf(r);
    const editable = hasToken();
    const hpHtml = r.hpUrl
      ? `<a href="${escHtml(r.hpUrl)}" target="_blank" rel="noopener">${escHtml(r.hpLabel || '公式サイト')}</a>`
      : '';
    const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}`;
    const ratingLabel = r.rating == null ? '未評価' : r.rating.toFixed(1);
    return `<div class="detail-content">
      <p class="addr">${escHtml(r.address)}</p>
      ${r.memo ? `<p class="muted">${escHtml(r.memo)}</p>` : ''}
      <div class="links">
        ${hpHtml}
        <a href="${gmapsUrl}" target="_blank" rel="noopener" class="gmaps">Google マップ</a>
      </div>
      ${editable ? `
      <div class="edit">
        ${starsHtml(i, r.rating, editable)}
        <span class="muted">${ratingLabel}</span>
        ${r.rating != null ? `<button data-act="rate-clear" data-i="${i}">評価を消す</button>` : ''}
      </div>
      <div class="edit">
        <button class="visit" data-act="visit-inc" data-i="${i}">来店 +1</button>
        <button data-act="visit-dec" data-i="${i}"${r.visits === 0 ? ' disabled' : ''}>−1</button>
      </div>` : ''}
    </div>`;
  }

  // ── マーカー生成（座標のある店だけ。以後は出し入れするだけで作り直さない） ──
  const markers = [];
  for (const r of restaurants) {
    if (r.lat == null || r.lng == null) continue;
    const marker = L.marker([r.lat, r.lng], { icon: makeIcon(r.visits > 0) });
    marker.bindPopup(detailHtml(r));
    markers.push({ r, marker, visited: r.visits > 0 });
  }

  // ── タグ絞り込み ──
  // activeTags: 選択中タグの Set。空なら全件表示。AND 条件で絞り込む。
  const activeTags = new Set();

  // 選択中タグを全て持つ店か？
  const matches = r => {
    if (activeTags.size === 0) return true;
    for (const t of activeTags) {
      if (!r.tags || !r.tags.includes(t)) return false;
    }
    return true;
  };

  // タグ一覧をデータから生成（件数の多い順、同数なら日本語ロケール順）
  const tagCountMap = new Map();
  for (const r of restaurants) {
    for (const t of (r.tags || [])) {
      tagCountMap.set(t, (tagCountMap.get(t) || 0) + 1);
    }
  }
  const allTags = [...tagCountMap.keys()].sort((a, b) => {
    const diff = tagCountMap.get(b) - tagCountMap.get(a);
    return diff !== 0 ? diff : a.localeCompare(b, 'ja');
  });

  const tagBar = el('tag-bar');

  function updateTagBar() {
    // 現在の絞り込み結果
    const currentHits = restaurants.filter(matches);

    for (const btn of tagBar.children) {
      const tag = btn.dataset.tag;
      if (tag === undefined) {
        // 「すべて」ボタン
        btn.setAttribute('aria-pressed', String(activeTags.size === 0));
        continue;
      }
      const pressed = activeTags.has(tag);
      btn.setAttribute('aria-pressed', String(pressed));

      if (pressed) {
        // 選択中タグは常に押せる（解除できるように）
        btn.disabled = false;
      } else {
        // このタグを追加したとき0件になるなら disabled
        const wouldMatch = currentHits.filter(r => r.tags && r.tags.includes(tag));
        btn.disabled = wouldMatch.length === 0;
      }
    }
  }

  // 「すべて」ボタン
  const allBtn = document.createElement('button');
  allBtn.textContent = 'すべて';
  allBtn.setAttribute('aria-pressed', 'true');
  allBtn.addEventListener('click', () => {
    activeTags.clear();
    updateTagBar();
    render();
  });
  tagBar.appendChild(allBtn);

  // 各タグボタン
  for (const tag of allTags) {
    const btn = document.createElement('button');
    btn.textContent = tag;
    btn.dataset.tag = tag;
    btn.setAttribute('aria-pressed', 'false');
    btn.addEventListener('click', () => {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
      } else {
        activeTags.add(tag);
      }
      updateTagBar();
      render();
    });
    tagBar.appendChild(btn);
  }

  // ── 描画 ──
  function render() {
    renderMap();
    renderList();
  }

  function renderMap() {
    markerGroup.clearLayers();
    const bounds = [];
    for (const { r, marker } of markers) {
      if (!matches(r)) continue;
      markerGroup.addLayer(marker);
      bounds.push(marker.getLatLng());
    }
    // 1件だけのときに街路レベルまで寄り切らないよう maxZoom で止める
    if (bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });

    const missing = restaurants.filter(r => matches(r) && r.lat == null).map(r => r.name);
    const banner = el('no-coords');
    banner.style.display = missing.length > 0 ? 'block' : 'none';
    banner.textContent = '座標未取得: ' + missing.join('、');
  }

  const openRows = new Set();

  function renderList() {
    const hits = restaurants.filter(matches);
    const listView = el('list-view');
    if (hits.length === 0) {
      listView.innerHTML = '<p class="empty">該当する店はありません</p>';
      return;
    }

    let rows = '';
    for (const r of hits) {
      // data-i は restaurants 配列のインデックス（フィルタ後連番ではない）
      const i = restaurants.indexOf(r);
      const visitLabel = r.visits > 0 ? `${r.visits}` : '0';
      const ratingLabel = r.rating == null ? '－' : r.rating.toFixed(1);
      // 来店 +1 を押すと表を作り直すので、開いている行は覚えておいて開いたまま戻す
      const open = openRows.has(i);
      rows += `<tr class="data-row${open ? ' open' : ''}" data-i="${i}">
        <td class="col-name">${escHtml(r.name)}</td>
        <td class="col-tags">${tagChipsHtml(r.tags)}</td>
        <td class="col-area">${escHtml(r.area)}</td>
        <td class="col-recommended">${escHtml(r.recommended || '')}</td>
        <td class="col-rating">${ratingLabel}</td>
        <td class="col-visits">${visitLabel}</td>
      </tr>
      <tr class="detail-row"${open ? '' : ' style="display:none"'} data-detail-i="${i}">
        <td colspan="6">${rowDetailHtml(r)}</td>
      </tr>`;
    }

    listView.innerHTML = `<table id="restaurant-table">
      <thead>
        <tr>
          <th>店名</th>
          <th>タグ</th>
          <th>エリア</th>
          <th>オススメ</th>
          <th>評価</th>
          <th>来店</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  // ── タブ切り替え ──
  function showTab(name) {
    const isMap = name === 'map';
    el('map-view').style.display  = isMap ? 'block' : 'none';
    el('list-view').style.display = isMap ? 'none'  : 'block';
    el('tab-map').setAttribute('aria-selected', String(isMap));
    el('tab-list').setAttribute('aria-selected', String(!isMap));
    // display を戻した直後はまだリフロー前でサイズ0を返すため、1フレーム待つ
    if (isMap) requestAnimationFrame(() => map.invalidateSize());
  }
  el('tab-map').addEventListener('click', () => showTab('map'));
  el('tab-list').addEventListener('click', () => showTab('list'));

  // ── アクセストークン ────────────────────────────────────────
  function hasToken() {
    return !!localStorage.getItem(TOKEN_KEY);
  }

  function renderTokenState() {
    el('token-state').textContent = hasToken()
      ? 'トークン保存済み。来店回数と評価を編集できます。'
      : 'トークン未設定。閲覧のみで、編集はできません。';
  }

  el('tab-settings').addEventListener('click', () => {
    const panel = el('settings');
    const open = panel.style.display !== 'block';
    panel.style.display = open ? 'block' : 'none';
    if (open) {
      renderTokenState();
      el('token-input').value = '';
    }
  });
  el('token-save').addEventListener('click', () => {
    const value = el('token-input').value.trim();
    if (!value) { toast('トークンが空です', true); return; }
    localStorage.setItem(TOKEN_KEY, value);
    el('token-input').value = '';
    renderTokenState();
    refreshAll();
    toast('トークンを保存しました');
  });
  el('token-clear').addEventListener('click', () => {
    localStorage.removeItem(TOKEN_KEY);
    el('token-input').value = '';
    renderTokenState();
    refreshAll();
    toast('トークンを削除しました');
  });

  // ── 通知 ──
  let toastTimer = null;
  function toast(message, isError) {
    const box = el('toast');
    box.textContent = message;
    box.className = isError ? 'error' : '';
    box.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { box.style.display = 'none'; }, isError ? 8000 : 4000);
  }

  // ── 編集操作 ──
  // capture で先に拾う。ここで再描画するとボタンが DOM から外れ、
  // Leaflet の「ポップアップ内クリックか」の判定（親を辿る）が失敗して
  // 地図がポップアップを閉じてしまうため、伝播もここで止める。
  // 表の行開閉もこのハンドラの後処理として実行する（[data-act] のボタンが
  // stopPropagation するので、行クリックハンドラには届かない）。
  document.addEventListener('click', ev => {
    const button = ev.target.closest('button[data-act]');
    if (button) {
      const r = restaurants[Number(button.dataset.i)];
      if (!r) return;
      ev.stopPropagation();
      if (button.dataset.act === 'visit-inc')  applyEdit(r, r.visits + 1, r.rating);
      if (button.dataset.act === 'visit-dec')  applyEdit(r, Math.max(0, r.visits - 1), r.rating);
      if (button.dataset.act === 'rate')       applyEdit(r, r.visits, Number(button.dataset.value));
      if (button.dataset.act === 'rate-clear') applyEdit(r, r.visits, null);
      return;
    }

    // 表の行開閉（[data-act] のボタンは上で return しているので届かない）
    const dataRow = ev.target.closest('tr.data-row');
    if (dataRow) {
      const i = dataRow.dataset.i;
      const detailRow = dataRow.nextElementSibling;
      if (!detailRow || !detailRow.classList.contains('detail-row')) return;
      const isOpen = detailRow.style.display !== 'none';
      detailRow.style.display = isOpen ? 'none' : '';
      dataRow.classList.toggle('open', !isOpen);
      if (isOpen) openRows.delete(Number(i)); else openRows.add(Number(i));
    }
  }, true);

  /** 画面を先に更新し、restaurants.md への書き込みが失敗したら戻す。 */
  function applyEdit(r, visits, rating) {
    if (visits === r.visits && rating === r.rating) return;
    const before = { visits: r.visits, rating: r.rating };
    r.visits = visits;
    r.rating = rating;
    refreshStore(r);
    enqueue(async () => {
      try {
        await writeRow(r);
        toast(`${r.name} を保存しました。地図データの反映まで1分ほどかかります`);
      } catch (e) {
        r.visits = before.visits;
        r.rating = before.rating;
        refreshStore(r);
        toast(`保存できませんでした: ${e.message}`, true);
      }
    });
  }

  function refreshMarker(r) {
    const entry = markers.find(m => m.r === r);
    if (!entry) return;
    const visited = r.visits > 0;
    if (visited !== entry.visited) {
      entry.visited = visited;
      // setIcon は bindPopup をやり直すので、開いていたポップアップが閉じてしまう
      const wasOpen = entry.marker.isPopupOpen();
      entry.marker.setIcon(makeIcon(visited));
      if (wasOpen) entry.marker.openPopup();
    }
    entry.marker.setPopupContent(detailHtml(r));
  }

  function refreshStore(r) {
    refreshMarker(r);
    renderList();
  }

  function refreshAll() {
    for (const { r } of markers) refreshMarker(r);
    renderList();
  }

  // ── restaurants.md への書き込み ──────────────────────────────
  // sha 付きの PUT なので、他所の更新と衝突したら 409/422 が返る。
  // その場合だけ読み直して一度やり直す。
  let writeQueue = Promise.resolve();
  function enqueue(task) {
    const run = writeQueue.then(task, task);
    writeQueue = run.catch(() => {});
    return run;
  }

  async function writeRow(r) {
    try {
      await writeRowOnce(r);
    } catch (e) {
      if (!e.conflict) throw e;
      await writeRowOnce(r);
    }
  }

  async function writeRowOnce(r) {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) throw new Error('トークンが設定されていません');
    const url = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(MD_PATH)}`;
    const headers = {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    const got = await fetch(url, { headers, cache: 'no-store' });
    if (!got.ok) throw new Error(await errorText(got));
    const file = await got.json();

    const body = JSON.stringify({
      message: `${r.name}: 来店${r.visits}回 / 評価${r.rating == null ? '-' : r.rating}`,
      content: toBase64(replaceRow(fromBase64(file.content), r)),
      sha: file.sha,
    });
    const put = await fetch(url, { method: 'PUT', headers, body });
    if (!put.ok) {
      const err = new Error(await errorText(put));
      err.conflict = put.status === 409 || put.status === 422;
      throw err;
    }
  }

  async function errorText(res) {
    if (res.status === 401 || res.status === 403) return `認証エラー (HTTP ${res.status})。トークンの権限を確認してください`;
    let detail = '';
    try { detail = (await res.json()).message || ''; } catch {}
    return `HTTP ${res.status}${detail ? ` ${detail}` : ''}`;
  }

  function splitRow(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  }

  /** 店名と住所が一致する行の来店回数（7列目）と評価（8列目）だけ差し替える。 */
  function replaceRow(markdown, r) {
    const lines = markdown.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim().startsWith('|')) continue;
      const cells = splitRow(lines[i]);
      if (cells.length < 9 || cells[0] !== r.name || cells[3] !== r.address) continue;
      cells[6] = String(r.visits);
      cells[7] = r.rating == null ? '-' : String(r.rating);
      lines[i] = `| ${cells.join(' | ')} |`;
      return lines.join('\n');
    }
    throw new Error(`restaurants.md に「${r.name}」の行が見つかりません`);
  }

  function toBase64(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = '';
    for (const byte of bytes) binary += String.fromCharCode(byte);
    return btoa(binary);
  }

  function fromBase64(base64) {
    const binary = atob(base64.replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(binary, c => c.charCodeAt(0)));
  }

  renderTokenState();
  updateTagBar();
  render();

  // ── ユーティリティ ──
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
})();
</script>
</body>
</html>
