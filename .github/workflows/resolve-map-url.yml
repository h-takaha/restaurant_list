name: 地図URLを解決

# routine の実行環境は Google ドメインが egress ポリシーで遮断されているため、
# 短縮 URL の解決だけ Actions 側に寄せる。手元で確かめたいとき用。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Google マップ共有 URL（複数ならスペース区切り）'
        required: true
        # 検証用の既定値: あかちょうちん（正解=美幌 43.824/144.105）と 東相内店（住所不明）
        default: 'https://maps.app.goo.gl/ozFsXbN1g2tw2GVc9 https://maps.app.goo.gl/b51o9Zis6Rwebc1e6'
  # 検証ブランチに push したときも走らせる
  push:
    branches: ['try-resolve-map']

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 解決してみる
        run: |
          URLS="${{ github.event.inputs.urls }}"
          if [ -z "$URLS" ]; then
            URLS="https://maps.app.goo.gl/ozFsXbN1g2tw2GVc9 https://maps.app.goo.gl/b51o9Zis6Rwebc1e6"
          fi
          echo "対象: $URLS"
          node resolve-map.mjs --debug $URLS
