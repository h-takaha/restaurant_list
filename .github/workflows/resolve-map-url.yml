name: 地図URLを解決

# routine の実行環境は Google ドメインが egress ポリシーで遮断されていて、
# メール本文の短縮 URL を開けない。件名だけでは店を特定しきれないとき
# （表記ゆれ・同名店が他県にある等）に、ここで正式な店名を確定させる。
#
# 座標はここでは取れない（HTML に入っている座標はランナーの所在地）。
# 座標は従来どおり build-map-data.yml が住所から国土地理院で引く。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Google マップ共有 URL（複数ならスペース区切り）'
        required: true
  # 検証用。main に入れる前に外す
  push:
    branches: ['try-resolve-map']

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 解決する
        # 入力を run: に直接展開するとスクリプトインジェクションになるので env 経由で渡す
        env:
          URLS: ${{ github.event.inputs.urls || 'https://maps.app.goo.gl/ozFsXbN1g2tw2GVc9 https://maps.app.goo.gl/b51o9Zis6Rwebc1e6' }}
        run: node resolve-map.mjs $URLS
